[package]
name = "pybergshamra"
version = "0.7.0"
edition = "2021"
description = "Python bindings for the Bergshamra XML Security library"
license = "BSD-2-Clause"
repository = "https://github.com/kushaldas/pybergshamra"
homepage = "https://github.com/kushaldas/pybergshamra"
documentation = "https://pybergshamra.readthedocs.io/"
readme = "README.md"
rust-version = "1.85"

[lib]
name = "pybergshamra"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
bergshamra-core = "0.7.0"
bergshamra-c14n = "0.7.0"
bergshamra-keys = { version = "0.7.0", features = ["legacy-algorithms"] }
bergshamra-dsig = "0.7.0"
bergshamra-enc = "0.7.0"
bergshamra-xml = "0.7.0"
bergshamra-crypto = "0.7.0"
bergshamra-pkcs12 = "0.7.0"
kryptering = { version = "0.4.1", default-features = false, features = ["legacy", "post-quantum", "pkcs11"] }
base64 = "0.22"
