[package]
name = "pybergshamra"
version = "0.7.0"
edition = "2021"
description = "Python bindings for the Bergshamra XML Security library"
license = "BSD-2-Clause"
repository = "https://github.com/kushaldas/pybergshamra"
homepage = "https://github.com/kushaldas/pybergshamra"
documentation = "https://pybergshamra.readthedocs.io/"
readme = "README.md"
rust-version = "1.85"

[lib]
name = "pybergshamra"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
bergshamra-core = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-core" }
bergshamra-c14n = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-c14n" }
bergshamra-keys = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-keys", features = ["legacy-algorithms"] }
bergshamra-dsig = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-dsig" }
bergshamra-enc = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-enc" }
bergshamra-xml = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-xml" }
bergshamra-crypto = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-crypto" }
bergshamra-pkcs12 = { version = "0.7.0", path = "../bergshamra/crates/bergshamra-pkcs12" }
kryptering = { version = "0.4.1", default-features = false, features = ["legacy", "post-quantum", "pkcs11"] }
base64 = "0.22"

