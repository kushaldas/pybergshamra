[package]
name = "pybergshamra"
version = "0.5.1"
edition = "2021"
description = "Python bindings for the Bergshamra XML Security library"
license = "BSD-2-Clause"
rust-version = "1.85"

[lib]
name = "pybergshamra"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
bergshamra-core = "0.5.1"
bergshamra-c14n = "0.5.1"
bergshamra-keys = { version = "0.5.1", features = ["legacy-algorithms"] }
bergshamra-dsig = "0.5.1"
bergshamra-enc = "0.5.1"
bergshamra-xml = "0.5.1"
bergshamra-crypto = "0.5.1"
bergshamra-pkcs12 = "0.5.1"
kryptering = { version = "0.3.0", default-features = false, features = ["legacy", "post-quantum", "pkcs11"] }
